
<!-- Modal do wyboru wspólnoty -->
<div class="modal fade" id="communityPickerModal" tabindex="-1" aria-labelledby="communityPickerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="communityPickerModalLabel">Wybierz wspólnotę</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Pole wyszukiwania -->
                <div class="mb-3">
                    <input 
                        type="text" 
                        id="community-picker-search" 
                        class="form-control" 
                        placeholder="Wpisz nazwę, miasto lub kraj..."
                        autocomplete="off"
                    >
                    <small class="text-muted">Zacznij pisać, aby wyszukać wspólnotę</small>
                </div>

                <!-- Wyniki wyszukiwania -->
                <div id="community-picker-results" class="list-group" style="max-height: 300px; overflow-y: auto;">
                    <div class="text-center text-muted py-4">
                        Wpisz frazę, aby rozpocząć wyszukiwanie
                    </div>
                </div>

                <!-- Loading spinner -->
                <div id="community-picker-loading" class="text-center py-3 d-none">
                    <div class="spinner-border spinner-border-sm text-primary" role="status">
                        <span class="visually-hidden">Ładowanie...</span>
                    </div>
                    <span class="ms-2 text-muted">Szukam...</span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
            </div>
        </div>
    </div>
</div>
